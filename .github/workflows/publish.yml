name: publish to PyPI

# Builds the sdist and wheel from a release tag and uploads them to PyPI with trusted
# publishing: PyPI trusts this workflow file (publish.yml) in this repository, running in the
# `pypi` environment, through GitHub's OIDC token. No API token is stored anywhere.
# Runs when a GitHub release is published, or by hand for a tag that already exists.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish, e.g. v1.1.1"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}   # a tag only: a branch name here fails the checkout
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build the sdist and wheel
        run: python -m build
      - run: twine check --strict dist/*
      # The tag, the file names and overfit.__version__ must all agree, or nothing is uploaded.
      - name: Check the built version matches the tag
        run: |
          want="${TAG#v}"
          ls -l dist
          test "$(ls dist | wc -l)" -eq 2 || { echo "::error::expected exactly an sdist and a wheel in dist/"; exit 1; }
          test -f "dist/backtest_overfitting-${want}.tar.gz" || { echo "::error::no sdist for ${want} (tag ${TAG})"; exit 1; }
          test -f "dist/backtest_overfitting-${want}-py3-none-any.whl" || { echo "::error::no wheel for ${want} (tag ${TAG})"; exit 1; }
      - name: Install the wheel in a clean venv and run it
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install -q dist/*.whl
          cd /tmp
          got=$(/tmp/smoke/bin/python -c 'import overfit; print(overfit.__version__)')
          test "$got" = "${TAG#v}" || { echo "::error::overfit.__version__ is ${got}, tag is ${TAG}"; exit 1; }
          /tmp/smoke/bin/backtest-overfitting --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/backtest-overfitting/
    permissions:
      id-token: write   # the OIDC token PyPI checks; this job holds no other permission
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
